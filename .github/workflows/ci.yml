name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: manta
          POSTGRES_PASSWORD: manta
          POSTGRES_DB: manta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manta -d manta"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://manta:manta@localhost:5432/manta?schema=public
      REVENUECAT_WEBHOOK_SECRET: ci-secreto-de-prueba-largo
      AUTH_JWT_SECRET: ci-secreto-de-prueba-para-firmar-sesiones-de-manta
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manta/api exec prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @manta/api test:e2e
